<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портфолио</title>
<meta name="description" content="Портфолио: работы, цены, как я работаю.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Tektur:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090c;
  --panel:#111116;
  --line:rgba(241,237,228,.12);
  --text:#f1ede4;
  --mute:rgba(241,237,228,.55);
  --accent:#c8ff4d;
  --pad:clamp(16px,5vw,72px);
}
*{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 Manrope,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3,.num,.logo{font-family:Tektur,Manrope,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}

/* шапка */
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px var(--pad);z-index:10;transition:background .3s}
header.solid{background:rgba(9,9,12,.92);border-bottom:1px solid var(--line)}
.logo{font-size:15px;font-weight:700}
nav{display:flex;align-items:center;gap:clamp(12px,2.4vw,32px);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
nav a.link{color:var(--mute);transition:color .2s}
nav a.link:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--text);color:#09090c;font-weight:600;font-size:14px;text-transform:none;letter-spacing:0;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:var(--accent)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
@media(max-width:640px){nav a.link{display:none}}

/* первый экран */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:17svh var(--pad) 0;text-align:center}
.hero h1{font-size:clamp(40px,9.5vw,136px);text-transform:lowercase;text-shadow:0 0 60px rgba(9,9,12,.9)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin-top:20px;max-width:440px;color:rgba(241,237,228,.8);text-shadow:0 0 18px #09090c,0 0 6px #09090c;font-size:clamp(14px,1.4vw,17px)}
.scroll{position:absolute;bottom:92px;left:50%;width:36px;height:36px;margin-left:-18px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--mute);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* секции */
section{padding:clamp(72px,11vw,150px) var(--pad)}
.wrap{max-width:1240px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,56px)}
.head h2{font-size:clamp(32px,6vw,76px);text-transform:lowercase}
.head p{max-width:340px;color:var(--mute);font-size:14px}
.label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}

/* работы */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);font:500 13px Manrope,sans-serif;cursor:pointer;transition:.2s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:#09090c;border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.card{display:block;background:#111116;border:1px solid var(--line);border-radius:18px;padding:12px;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-6px);border-color:rgba(200,255,77,.5)}
.card.hide{display:none}
.cover{aspect-ratio:16/10;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-family:Tektur,sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:rgba(241,237,228,.45);background-size:cover;background-position:center}
.cover img,.cover video{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 6px 6px}
.meta small{display:block;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.meta h3{font-size:20px;font-weight:700;margin-bottom:6px}
.meta p{color:var(--mute);font-size:13px}
.arrow{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.25s}
.card:hover .arrow{background:var(--accent);color:#09090c;border-color:var(--accent);transform:rotate(-45deg)}

/* цены */
.row{display:grid;grid-template-columns:minmax(150px,1.1fr) 2.4fr auto auto;gap:20px;align-items:center;padding:22px 10px;border-top:1px solid var(--line);transition:background .25s,padding .25s}
.row:last-child{border-bottom:1px solid var(--line)}
.row:hover{background:rgba(241,237,228,.04);padding-left:22px}
.row h3{font-size:clamp(18px,2vw,24px);font-weight:700;text-transform:lowercase}
.row p{color:var(--mute);font-size:14px}
.row b{font-family:Tektur,sans-serif;font-size:18px;white-space:nowrap}
.row a{color:var(--mute);font-size:13px;white-space:nowrap;transition:color .2s}
.row a:hover{color:var(--accent)}
@media(max-width:760px){.row{grid-template-columns:1fr auto;gap:8px 16px}.row p{grid-column:1/-1;order:3}.row a{display:none}}

/* процесс */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px}
.step{border-top:1px solid var(--line);padding-top:20px;transition:border-color .3s}
.step:hover{border-color:var(--accent)}
.num{font-size:44px;color:var(--mute);transition:color .3s}
.step:hover .num{color:var(--accent)}
.step h3{font-size:17px;font-weight:700;margin:14px 0 8px}
.step p{color:var(--mute);font-size:14px}

/* финал */
.cta{text-align:center;min-height:80svh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cta h2{font-size:clamp(40px,9vw,128px);text-transform:lowercase}
.cta p{margin:20px 0 30px;color:var(--mute)}
.cta .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
footer{padding:24px var(--pad);text-align:center;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}

/* выбор частиц */
.picker{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 24px);overflow-x:auto;padding:6px;border-radius:999px;background:rgba(17,17,22,.94);border:1px solid var(--line);scrollbar-width:none}
.picker span{padding:0 8px 0 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.picker button{padding:8px 14px;border-radius:999px;border:0;background:none;color:var(--mute);font:500 13px Manrope,sans-serif;cursor:pointer;white-space:nowrap;transition:.2s}
.picker button:hover{color:var(--text)}
.picker button.on{background:var(--accent);color:#09090c}

/* появление */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.scroll{animation:none}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<header id="top">
  <a class="logo" href="#" data-t="logo"></a>
  <nav>
    <a class="link" href="#works">Работы</a>
    <a class="link" href="#prices">Цены</a>
    <a class="link" href="#process">Как работаю</a>
    <a class="btn" data-h="contact" href="#">Написать</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1 data-t="title"></h1>
    <p data-t="subtitle"></p>
    <a class="scroll" href="#works" aria-label="Вниз">↓</a>
  </section>

  <section id="works"><div class="wrap">
    <div class="head rv">
      <div><span class="label">01 / портфолио</span><h2>мои работы</h2></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div></section>

  <section id="prices"><div class="wrap">
    <div class="head rv">
      <div><span class="label">02 / услуги</span><h2>сколько стоит</h2></div>
      <p data-t="pricesNote"></p>
    </div>
    <div id="rows"></div>
  </div></section>

  <section id="process"><div class="wrap">
    <div class="head rv">
      <div><span class="label">03 / процесс</span><h2>как я работаю</h2></div>
    </div>
    <div class="steps" id="steps"></div>
  </div></section>

  <section class="cta" id="contact">
    <span class="label rv">04 / контакты</span>
    <h2 class="rv">есть проект?</h2>
    <p class="rv" data-t="ctaNote"></p>
    <div class="btns rv" id="links"></div>
  </section>
</main>

<footer data-t="footer"></footer>

<script>
/* ====== ВСЁ СОДЕРЖИМОЕ САЙТА МЕНЯЕТСЯ ЗДЕСЬ ====== */
const DATA = {
  logo: 'ваше имя',
  title: 'made by <em>name</em>',          // <em> красит слово в акцентный цвет
  subtitle: 'Пара строк о себе: чем занимаетесь и для кого. Это заглушка.',
  contact: '#',                            // ссылка кнопки «Написать»
  pricesNote: 'Цены примерные. Точную стоимость назову после обсуждения задачи.',
  ctaNote: 'Напишите - отвечу в течение дня.',
  footer: '© 2026 ваше имя',
  works: [  // img: 'works/1.jpg' или video: 'works/1.mp4' вместо заглушки
    { cat: 'Категория 1', title: 'Проект 01', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 2', title: 'Проект 02', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 3', title: 'Проект 03', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 1', title: 'Проект 04', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 2', title: 'Проект 05', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 3', title: 'Проект 06', text: 'Короткое описание работы в одну-две строки.', url: '#' },
  ],
  prices: [
    { name: 'Услуга 1', text: 'Что входит в услугу, сроки и количество правок.', price: 'от 0 000 ₽' },
    { name: 'Услуга 2', text: 'Что входит в услугу, сроки и количество правок.', price: 'от 0 000 ₽' },
    { name: 'Услуга 3', text: 'Что входит в услугу, сроки и количество правок.', price: 'от 0 000 ₽' },
    { name: 'Услуга 4', text: 'Что входит в услугу, сроки и количество правок.', price: 'от 0 000 ₽' },
    { name: 'Своя идея', text: 'Нестандартная задача - обсудим отдельно.', price: 'по запросу' },
  ],
  steps: [
    { title: 'Заявка', text: 'Вы пишете мне и рассказываете о задаче.' },
    { title: 'Предоплата', text: 'Согласуем объём, сроки и стоимость.' },
    { title: 'Эскиз и правки', text: 'Показываю вариант, вносим изменения.' },
    { title: 'Готовые файлы', text: 'Передаю результат в нужных форматах.' },
  ],
  links: [
    { name: 'Написать в Telegram', url: '#' },
    { name: 'Telegram-канал ↗', url: '#' },
    { name: 'TikTok ↗', url: '#' },
  ],
};
/* ================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.querySelectorAll('[data-t]').forEach(e => {
  const k = e.dataset.t;
  if (k === 'title') e.innerHTML = DATA[k]; else e.textContent = DATA[k];
});
document.querySelectorAll('[data-h]').forEach(e => e.href = DATA[e.dataset.h]);

const covers = [
  'linear-gradient(135deg,#1b1b24,#2c2440 55%,#c8ff4d22)',
  'linear-gradient(135deg,#15181c,#1f3a36 60%,#c8ff4d33)',
  'linear-gradient(135deg,#1c1618,#40242c 55%,#f1ede422)',
];
$('#grid').innerHTML = DATA.works.map((w, i) => {
  const media = w.video ? `<video src="${esc(w.video)}" muted loop playsinline autoplay></video>`
    : w.img ? `<img src="${esc(w.img)}" alt="${esc(w.title)}" loading="lazy">`
    : `обложка ${String(i + 1).padStart(2, '0')}`;
  return `<a class="card rv" href="${esc(w.url)}" data-cat="${esc(w.cat)}">
    <div class="cover" style="background-image:${covers[i % covers.length]}">${media}</div>
    <div class="meta"><div><small>${esc(w.cat)}</small><h3>${esc(w.title)}</h3><p>${esc(w.text)}</p></div><span class="arrow">→</span></div>
  </a>`;
}).join('');

const cats = ['Все', ...new Set(DATA.works.map(w => w.cat))];
$('#chips').innerHTML = cats.map((c, i) => `<button class="chip${i ? '' : ' on'}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('hide', b.dataset.c !== 'Все' && c.dataset.cat !== b.dataset.c));
});

$('#rows').innerHTML = DATA.prices.map(p => `<div class="row rv">
  <h3>${esc(p.name)}</h3><p>${esc(p.text)}</p><b>${esc(p.price)}</b><a href="${esc(DATA.contact)}">заказать →</a></div>`).join('');
$('#steps').innerHTML = DATA.steps.map((s, i) => `<div class="step rv">
  <div class="num">${String(i + 1).padStart(2, '0')}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('');
$('#links').innerHTML = DATA.links.map((l, i) =>
  `<a class="btn${i ? ' ghost' : ''}" href="${esc(l.url)}">${esc(l.name)}</a>`).join('');

/* появление блоков */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .12 });
document.querySelectorAll('.rv').forEach((e, i) => { e.style.transitionDelay = (i % 4) * 70 + 'ms'; io.observe(e); });

/* шапка и ссылки-заглушки */
addEventListener('scroll', () => $('#top').classList.toggle('solid', scrollY > 40), { passive: true });
document.addEventListener('click', e => {
  const a = e.target.closest('a[href="#"]');
  if (a && !a.classList.contains('logo')) e.preventDefault();
});
</script>

<div class="picker" id="picker"><span>частицы</span></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ====== плавная прокрутка ====== */
let lenis = null;
if (!still) (async () => {
  try {
    const { default: Lenis } = await import('https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.mjs');
    lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 1, smoothWheel: true });
    const raf = t => { lenis.raf(t); requestAnimationFrame(raf); };
    requestAnimationFrame(raf);
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#"]'); if (!a) return;
      const id = a.getAttribute('href');
      if (id === '#') { if (a.classList.contains('logo')) { e.preventDefault(); lenis.scrollTo(0, { duration: 1.4 }); } return; }
      const el = document.querySelector(id); if (!el) return;
      e.preventDefault(); lenis.scrollTo(el, { offset: -50, duration: 1.5 });
    });
  } catch (e) { document.documentElement.style.scrollBehavior = 'smooth'; }
})();

/* ====== 3D-поле частиц ======
   Быстрый вариант: каждая форма один раз «запекается» из 3D-модели в атлас кадров,
   а поле рисуется одним вызовом из плоских спрайтов. Вся анимация считается в шейдере на видеокарте. */
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const TYPE = 'flower';   // форма по умолчанию: flower | star | crystal | ring | pearl | cube

const std = o => new THREE.MeshStandardMaterial(o);
const TYPES = {
  flower: { name: 'Цветы', upright: true, size: 1.15, parts: () => {
    const sh = new THREE.Shape(), n = 100;
    for (let i = 0; i <= n; i++) {
      const a = i / n * Math.PI * 2, r = .3 + .7 * Math.pow(Math.abs(Math.cos(2.5 * a)), .7);
      i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    const g = new THREE.ExtrudeGeometry(sh, { depth: .04, bevelEnabled: true, bevelThickness: .035, bevelSize: .035, bevelSegments: 2 });
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setZ(i, p.getZ(i) + .42 * (x * x + y * y)); }
    g.rotateX(-Math.PI / 2); g.computeVertexNormals();
    const c = new THREE.SphereGeometry(.2, 20, 14); c.translate(0, .13, 0);
    return [[g, std({ roughness: .5, metalness: 0, side: THREE.DoubleSide })],
            [c, std({ color: '#c8ff4d', roughness: .35, emissive: '#5a7a10', emissiveIntensity: .6 })]];
  } },
  star: { name: 'Звёзды', size: 1, parts: () => {
    const sh = new THREE.Shape();
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 + Math.PI / 2, r = i % 2 ? .47 : 1; i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
    const g = new THREE.ExtrudeGeometry(sh, { depth: .2, bevelEnabled: true, bevelThickness: .14, bevelSize: .12, bevelSegments: 4 });
    g.center();
    return [[g, std({ roughness: .22, metalness: .65 })]];
  } },
  crystal: { name: 'Кристаллы', size: 1.1, parts: () => {
    const g = new THREE.OctahedronGeometry(1, 0); g.scale(.55, 1.25, .55);
    return [[g, new THREE.MeshPhysicalMaterial({ roughness: .06, metalness: .3, flatShading: true, clearcoat: 1, clearcoatRoughness: .05 })]];
  } },
  ring: { name: 'Кольца', size: 1, parts: () =>
    [[new THREE.TorusGeometry(.75, .27, 24, 64), std({ roughness: .16, metalness: 1 })]] },
  pearl: { name: 'Жемчуг', size: .8, parts: () =>
    [[new THREE.SphereGeometry(.8, 48, 32), new THREE.MeshPhysicalMaterial({ roughness: .28, metalness: .1, clearcoat: 1, clearcoatRoughness: .08 })]] },
  cube: { name: 'Кубы', size: .85, parts: () =>
    [[new RoundedBoxGeometry(1.3, 1.3, 1.3, 6, .24), std({ roughness: .28, metalness: .45 })]] },
};

const GRID = 8, FRAMES = GRID * GRID, CELL = 256;      // атлас 2048x2048: 64 кадра поворота
const VERT = `
attribute vec3 aPos;   // x, z, фаза
attribute vec4 aRnd;   // размер, скорость вращения, сдвиг кадра, скорость кадров
attribute vec3 aTint;
uniform float uT, uDrift, uSize; uniform vec3 uHit;
varying vec2 vA, vB; varying float vMix, vFog; varying vec3 vTint;
const float Z0 = -34., ZL = 41., R = 2.6, G = ${GRID}., FR = ${FRAMES}.;
vec2 cell(float f){ return vec2(mod(f, G), floor(f / G)); }
void main(){
  float x = aPos.x, z = mod(aPos.y + uDrift, ZL) + Z0;
  float y = sin(x * .5 + uT * .6) * .3 + sin(z * .45 + uT * .5 + aPos.z * .15) * .35;
  vec2 d = vec2(x, z) - uHit.xy; float dl = length(d);
  float k = uHit.z * pow(max(0., 1. - dl / R), 2.);
  vec2 dir = d / max(dl, .001); x += dir.x * k * 1.6; z += dir.y * k * 1.6; y += k * 1.1;
  float fade = min(1., (z - Z0) / 5.) * clamp((Z0 + ZL - 2.2 - z) / 3.5, 0., 1.);
  vec4 mv = viewMatrix * vec4(x, y, z, 1.);
  float a = aPos.z + uT * aRnd.y, c = cos(a), s = sin(a);
  mv.xy += mat2(c, s, -s, c) * position.xy * aRnd.x * uSize * fade;
  gl_Position = projectionMatrix * mv;
  float f = mod(aRnd.z * FR + uT * aRnd.w, FR), f0 = floor(f);
  vA = (cell(f0) + uv) / G; vB = (cell(mod(f0 + 1., FR)) + uv) / G; vMix = f - f0;
  float fd = .062 * length(mv.xyz); vFog = exp(-fd * fd); vTint = aTint;
}`;
const FRAG = `
uniform sampler2D uMap; uniform vec3 uBg; uniform float uDim;
varying vec2 vA, vB; varying float vMix, vFog; varying vec3 vTint;
void main(){
  vec4 t = mix(texture2D(uMap, vA), texture2D(uMap, vB), vMix);
  if (t.a < .08) discard;
  vec3 col = pow(clamp(t.rgb / t.a, 0., 1.), vec3(1. / 2.2)) * vTint;
  gl_FragColor = vec4(mix(uBg, col, vFog * uDim), t.a);
}`;

const picker = document.getElementById('picker');
try {
  const cv = document.getElementById('field');
  const mobile = innerWidth < 700;
  let pr = Math.min(devicePixelRatio || 1, 1.5);
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(pr);
  const BG = new THREE.Color('#09090c');
  renderer.setClearColor(BG, 1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, .1, 90);

  /* запекание формы в атлас */
  const bakeScene = new THREE.Scene();
  bakeScene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
  const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(3, 5, 4); bakeScene.add(key);
  const rim = new THREE.DirectionalLight(0xb9a8ff, 1); rim.position.set(-4, -1, -3); bakeScene.add(rim);
  const bakeCam = new THREE.OrthographicCamera(-1.4, 1.4, 1.4, -1.4, .1, 20); bakeCam.position.z = 6;
  const tilt = new THREE.Group(), spin = new THREE.Group(); tilt.add(spin); bakeScene.add(tilt);
  const atlas = new THREE.WebGLRenderTarget(GRID * CELL, GRID * CELL, { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
  atlas.texture.anisotropy = 4;

  function bake(type) {
    spin.children.slice().forEach(m => { spin.remove(m); m.geometry.dispose(); m.material.dispose(); });
    type.parts().forEach(([g, m]) => spin.add(new THREE.Mesh(g, m)));
    renderer.setRenderTarget(atlas); renderer.setClearColor(0x000000, 0);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, GRID * CELL, GRID * CELL); renderer.clear();
    renderer.setScissorTest(true);
    for (let i = 0; i < FRAMES; i++) {
      const th = i / FRAMES * Math.PI * 2;
      if (type.upright) { tilt.rotation.set(0, 0, 0); spin.rotation.set(Math.PI / 2 + Math.cos(th) * .5, 0, Math.sin(th) * .5); }
      else { tilt.rotation.set(.55, 0, .4); spin.rotation.set(0, th, 0); }
      const x = (i % GRID) * CELL, y = (i / GRID | 0) * CELL;
      renderer.setViewport(x, y, CELL, CELL); renderer.setScissor(x, y, CELL, CELL);
      renderer.render(bakeScene, bakeCam);
    }
    renderer.setScissorTest(false); renderer.setRenderTarget(null); renderer.setClearColor(BG, 1);
    size();
  }

  /* поле: один вызов отрисовки */
  const N = mobile ? 2200 : 6000, XR = 22, ZL = 41;
  const rnd = Math.random, tints = [[.95, .93, .9], [.95, .93, .9], [.95, .93, .9], [1, 1, 1], [1, 1, 1], [.8, 1, .4], [.74, .68, 1], [.7, .95, .9]];
  const aPos = new Float32Array(N * 3), aRnd = new Float32Array(N * 4), aTint = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    aPos.set([(rnd() * 2 - 1) * XR, rnd() * ZL, rnd() * 6.283], i * 3);
    aRnd.set([.1 + rnd() * rnd() * .3, (rnd() - .5) * 1.2, rnd(), (rnd() < .5 ? -1 : 1) * (5 + rnd() * 9)], i * 4);
    aTint.set(tints[rnd() * tints.length | 0], i * 3);
  }
  const quad = new THREE.PlaneGeometry(2.8, 2.8), geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index; geo.setAttribute('position', quad.attributes.position); geo.setAttribute('uv', quad.attributes.uv);
  geo.setAttribute('aPos', new THREE.InstancedBufferAttribute(aPos, 3));
  geo.setAttribute('aRnd', new THREE.InstancedBufferAttribute(aRnd, 4));
  geo.setAttribute('aTint', new THREE.InstancedBufferAttribute(aTint, 3));
  geo.instanceCount = N;
  const U = { uT: { value: 0 }, uDrift: { value: 0 }, uSize: { value: 1 }, uDim: { value: 1 }, uHit: { value: new THREE.Vector3() },
              uMap: { value: atlas.texture }, uBg: { value: new THREE.Vector3(9 / 255, 9 / 255, 12 / 255) } };
  const mat = new THREE.ShaderMaterial({ uniforms: U, vertexShader: VERT, fragmentShader: FRAG, alphaToCoverage: true });
  const field = new THREE.Mesh(geo, mat); field.frustumCulled = false; scene.add(field);

  function build(id) {
    if (!TYPES[id]) id = TYPE;
    bake(TYPES[id]); U.uSize.value = TYPES[id].size;
    picker.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
    try { localStorage.setItem('particles', id); } catch (e) {}
    if (still) requestAnimationFrame(frame);
  }
  function size() {
    const W = innerWidth, H = innerHeight;
    renderer.setPixelRatio(pr); renderer.setSize(W, H, false);
    camera.aspect = W / H; camera.fov = W < H ? 66 : 50; camera.updateProjectionMatrix();
  }

  const ray = new THREE.Raycaster(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const ndc = new THREE.Vector2(9, 9), hit = new THREE.Vector3(), look = new THREE.Vector3();
  let t = 0, last = 0, sc = 0, mx = 0, my = 0, hitK = 0, slow = 0, frames = 0;

  function frame(now) {
    const raw = (now - last) / 1000 || 0, dt = Math.min(.05, raw); last = now; t += dt;
    const target = scrollY / innerHeight; sc = still ? target : sc + (target - sc) * .14;
    const s = Math.min(sc, 1.6), inside = ndc.x < 2;
    mx += ((inside ? ndc.x : 0) - mx) * .04; my += ((inside ? ndc.y : 0) - my) * .04;
    // при прокрутке камера ныряет под поле: оно уходит вверх и остаётся фоном
    camera.position.set(mx * 1.4, 2.3 - s * 3.6 - my * .35, 6);
    look.set(mx * .5, 1.05 - s * .5, -5); camera.lookAt(look);
    U.uDim.value = Math.max(.3, 1 - Math.max(0, sc - .5) * .9);
    U.uT.value = t; U.uDrift.value = t * .75;

    let on = false;
    if (inside) { ray.setFromCamera(ndc, camera); on = !!ray.ray.intersectPlane(ground, hit); }
    hitK += ((on ? 1 : 0) - hitK) * .1;
    if (on) U.uHit.value.set(hit.x, hit.z, hitK); else U.uHit.value.z = hitK;
    renderer.render(scene, camera);

    // если кадры идут медленно, снижаем качество на ходу
    if (!still && raw > 0 && ++frames > 40) {
      slow = slow * .95 + raw * .05;
      if (frames > 160 && slow > .024) {
        if (pr > 1) { pr = 1; size(); } else if (geo.instanceCount > 1500) geo.instanceCount = geo.instanceCount * .7 | 0;
        frames = 40; slow = .016;
      }
    }
    if (!still) requestAnimationFrame(frame);
  }

  for (const [id, v] of Object.entries(TYPES)) {
    const b = document.createElement('button'); b.dataset.t = id; b.textContent = v.name;
    b.onclick = () => build(id); picker.append(b);
  }
  addEventListener('resize', () => { size(); if (still) requestAnimationFrame(frame); });
  addEventListener('pointermove', e => { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => ndc.set(9, 9));
  if (still) addEventListener('scroll', () => requestAnimationFrame(frame), { passive: true });

  let saved = null; try { saved = localStorage.getItem('particles'); } catch (e) {}
  size(); build(new URLSearchParams(location.search).get('p') || saved || TYPE);
  window.__field = { get count() { return geo.instanceCount; }, get pr() { return pr; }, get ms() { return slow * 1000; } };
  if (!still) requestAnimationFrame(frame);
} catch (e) {
  console.error(e); picker.remove();
}
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портфолио</title>
<meta name="description" content="Портфолио: работы, цены, как я работаю.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Tektur:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090c;
  --panel:#111116;
  --line:rgba(241,237,228,.12);
  --text:#f1ede4;
  --mute:rgba(241,237,228,.55);
  --accent:#c8ff4d;
  --pad:clamp(16px,5vw,72px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 Manrope,system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3,.num,.logo{font-family:Tektur,Manrope,sans-serif;font-weight:800;letter-spacing:-.01em;line-height:1}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header,footer{position:relative;z-index:1}

/* шапка */
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px var(--pad);z-index:10;transition:background .3s,backdrop-filter .3s}
header.solid{background:rgba(9,9,12,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-size:15px;font-weight:700}
nav{display:flex;align-items:center;gap:clamp(12px,2.4vw,32px);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
nav a.link{color:var(--mute);transition:color .2s}
nav a.link:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--text);color:#09090c;font-weight:600;font-size:14px;text-transform:none;letter-spacing:0;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:var(--accent)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
@media(max-width:640px){nav a.link{display:none}}

/* первый экран */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:22svh var(--pad) 0;text-align:center}
.hero h1{font-size:clamp(40px,9.5vw,136px);text-transform:lowercase;text-shadow:0 0 60px rgba(9,9,12,.9)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin-top:20px;max-width:440px;color:var(--mute);font-size:clamp(14px,1.4vw,17px)}
.scroll{position:absolute;bottom:28px;left:50%;width:36px;height:36px;margin-left:-18px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--mute);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* секции */
section{padding:clamp(72px,11vw,150px) var(--pad)}
.wrap{max-width:1240px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,56px)}
.head h2{font-size:clamp(32px,6vw,76px);text-transform:lowercase}
.head p{max-width:340px;color:var(--mute);font-size:14px}
.label{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}

/* работы */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);font:500 13px Manrope,sans-serif;cursor:pointer;transition:.2s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:#09090c;border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.card{display:block;background:rgba(17,17,22,.78);border:1px solid var(--line);border-radius:18px;padding:12px;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-6px);border-color:rgba(200,255,77,.5)}
.card.hide{display:none}
.cover{aspect-ratio:16/10;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-family:Tektur,sans-serif;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:rgba(241,237,228,.45);background-size:cover;background-position:center}
.cover img,.cover video{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 6px 6px}
.meta small{display:block;color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.meta h3{font-size:20px;font-weight:700;margin-bottom:6px}
.meta p{color:var(--mute);font-size:13px}
.arrow{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:.25s}
.card:hover .arrow{background:var(--accent);color:#09090c;border-color:var(--accent);transform:rotate(-45deg)}

/* цены */
.row{display:grid;grid-template-columns:minmax(150px,1.1fr) 2.4fr auto auto;gap:20px;align-items:center;padding:22px 10px;border-top:1px solid var(--line);transition:background .25s,padding .25s}
.row:last-child{border-bottom:1px solid var(--line)}
.row:hover{background:rgba(241,237,228,.04);padding-left:22px}
.row h3{font-size:clamp(18px,2vw,24px);font-weight:700;text-transform:lowercase}
.row p{color:var(--mute);font-size:14px}
.row b{font-family:Tektur,sans-serif;font-size:18px;white-space:nowrap}
.row a{color:var(--mute);font-size:13px;white-space:nowrap;transition:color .2s}
.row a:hover{color:var(--accent)}
@media(max-width:760px){.row{grid-template-columns:1fr auto;gap:8px 16px}.row p{grid-column:1/-1;order:3}.row a{display:none}}

/* процесс */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:28px}
.step{border-top:1px solid var(--line);padding-top:20px;transition:border-color .3s}
.step:hover{border-color:var(--accent)}
.num{font-size:44px;color:var(--mute);transition:color .3s}
.step:hover .num{color:var(--accent)}
.step h3{font-size:17px;font-weight:700;margin:14px 0 8px}
.step p{color:var(--mute);font-size:14px}

/* финал */
.cta{text-align:center;min-height:80svh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cta h2{font-size:clamp(40px,9vw,128px);text-transform:lowercase}
.cta p{margin:20px 0 30px;color:var(--mute)}
.cta .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
footer{padding:24px var(--pad);text-align:center;color:var(--mute);font-size:12px;border-top:1px solid var(--line)}

/* появление */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.scroll{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<header id="top">
  <a class="logo" href="#" data-t="logo"></a>
  <nav>
    <a class="link" href="#works">Работы</a>
    <a class="link" href="#prices">Цены</a>
    <a class="link" href="#process">Как работаю</a>
    <a class="btn" data-h="contact" href="#">Написать</a>
  </nav>
</header>

<main>
  <section class="hero">
    <h1 data-t="title"></h1>
    <p data-t="subtitle"></p>
    <a class="scroll" href="#works" aria-label="Вниз">↓</a>
  </section>

  <section id="works"><div class="wrap">
    <div class="head rv">
      <div><span class="label">01 / портфолио</span><h2>мои работы</h2></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div></section>

  <section id="prices"><div class="wrap">
    <div class="head rv">
      <div><span class="label">02 / услуги</span><h2>сколько стоит</h2></div>
      <p data-t="pricesNote"></p>
    </div>
    <div id="rows"></div>
  </div></section>

  <section id="process"><div class="wrap">
    <div class="head rv">
      <div><span class="label">03 / процесс</span><h2>как я работаю</h2></div>
    </div>
    <div class="steps" id="steps"></div>
  </div></section>

  <section class="cta" id="contact">
    <span class="label rv">04 / контакты</span>
    <h2 class="rv">есть проект?</h2>
    <p class="rv" data-t="ctaNote"></p>
    <div class="btns rv" id="links"></div>
  </section>
</main>

<footer data-t="footer"></footer>

<script>
/* ====== ВСЁ СОДЕРЖИМОЕ САЙТА МЕНЯЕТСЯ ЗДЕСЬ ====== */
const DATA = {
  logo: 'ваше имя',
  title: 'made by <em>name</em>',          // <em> красит слово в акцентный цвет
  subtitle: 'Пара строк о себе: чем занимаетесь и для кого. Это заглушка.',
  contact: '#',                            // ссылка кнопки «Написать»
  pricesNote: 'Цены примерные. Точную стоимость назову после обсуждения задачи.',
  ctaNote: 'Напишите - отвечу в течение дня.',
  footer: '© 2026 ваше имя',
  works: [  // img: 'works/1.jpg' или video: 'works/1.mp4' вместо заглушки
    { cat: 'Категория 1', title: 'Проект 01', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 2', title: 'Проект 02', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 3', title: 'Проект 03', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 1', title: 'Проект 04', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 2', title: 'Проект 05', text: 'Короткое описание работы в одну-две строки.', url: '#' },
    { cat: 'Категория 3', title: 'Проект 06', text: 'Короткое описание работы в одну-две строки.', url: '#' },
  ],
  prices: [
    { name: 'Услуга 1', text: 'Что входит в услугу, сроки и количество правок.', price: 'от 0 000 ₽' },
    { name: 'Услуга 2', text: 'Что входит в услугу, сроки и количество правок.', price: 'от 0 000 ₽' },
    { name: 'Услуга 3', text: 'Что входит в услугу, сроки и количество правок.', price: 'от 0 000 ₽' },
    { name: 'Услуга 4', text: 'Что входит в услугу, сроки и количество правок.', price: 'от 0 000 ₽' },
    { name: 'Своя идея', text: 'Нестандартная задача - обсудим отдельно.', price: 'по запросу' },
  ],
  steps: [
    { title: 'Заявка', text: 'Вы пишете мне и рассказываете о задаче.' },
    { title: 'Предоплата', text: 'Согласуем объём, сроки и стоимость.' },
    { title: 'Эскиз и правки', text: 'Показываю вариант, вносим изменения.' },
    { title: 'Готовые файлы', text: 'Передаю результат в нужных форматах.' },
  ],
  links: [
    { name: 'Написать в Telegram', url: '#' },
    { name: 'Telegram-канал ↗', url: '#' },
    { name: 'TikTok ↗', url: '#' },
  ],
};
/* ================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.querySelectorAll('[data-t]').forEach(e => {
  const k = e.dataset.t;
  if (k === 'title') e.innerHTML = DATA[k]; else e.textContent = DATA[k];
});
document.querySelectorAll('[data-h]').forEach(e => e.href = DATA[e.dataset.h]);

const covers = [
  'linear-gradient(135deg,#1b1b24,#2c2440 55%,#c8ff4d22)',
  'linear-gradient(135deg,#15181c,#1f3a36 60%,#c8ff4d33)',
  'linear-gradient(135deg,#1c1618,#40242c 55%,#f1ede422)',
];
$('#grid').innerHTML = DATA.works.map((w, i) => {
  const media = w.video ? `<video src="${esc(w.video)}" muted loop playsinline autoplay></video>`
    : w.img ? `<img src="${esc(w.img)}" alt="${esc(w.title)}" loading="lazy">`
    : `обложка ${String(i + 1).padStart(2, '0')}`;
  return `<a class="card rv" href="${esc(w.url)}" data-cat="${esc(w.cat)}">
    <div class="cover" style="background-image:${covers[i % covers.length]}">${media}</div>
    <div class="meta"><div><small>${esc(w.cat)}</small><h3>${esc(w.title)}</h3><p>${esc(w.text)}</p></div><span class="arrow">→</span></div>
  </a>`;
}).join('');

const cats = ['Все', ...new Set(DATA.works.map(w => w.cat))];
$('#chips').innerHTML = cats.map((c, i) => `<button class="chip${i ? '' : ' on'}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('hide', b.dataset.c !== 'Все' && c.dataset.cat !== b.dataset.c));
});

$('#rows').innerHTML = DATA.prices.map(p => `<div class="row rv">
  <h3>${esc(p.name)}</h3><p>${esc(p.text)}</p><b>${esc(p.price)}</b><a href="${esc(DATA.contact)}">заказать →</a></div>`).join('');
$('#steps').innerHTML = DATA.steps.map((s, i) => `<div class="step rv">
  <div class="num">${String(i + 1).padStart(2, '0')}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('');
$('#links').innerHTML = DATA.links.map((l, i) =>
  `<a class="btn${i ? ' ghost' : ''}" href="${esc(l.url)}">${esc(l.name)}</a>`).join('');

/* появление блоков */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .12 });
document.querySelectorAll('.rv').forEach((e, i) => { e.style.transitionDelay = (i % 4) * 70 + 'ms'; io.observe(e); });

/* ====== поле частиц ====== */
(() => {
  const cv = $('#field'), g = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ZR = 22, XR = 15;
  let W, H, D, parts = [], t = 0, sc = 0, mx = 0, my = 0, px = -1e4, py = -1e4, last = 0;

  function sprite(color) {
    const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
    const x = c.getContext('2d'), m = s / 2;
    const glow = x.createRadialGradient(m, m, 0, m, m, m);
    glow.addColorStop(0, color + 'aa'); glow.addColorStop(.35, color + '22'); glow.addColorStop(1, color + '00');
    x.fillStyle = glow; x.fillRect(0, 0, s, s);
    x.fillStyle = color; x.beginPath();               // четырёхлучевая искра
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, r = i % 2 ? 4 : 26;
      x.lineTo(m + Math.cos(a) * r, m + Math.sin(a) * r);
    }
    x.closePath(); x.fill();
    return c;
  }
  const sprites = ['#f1ede4', '#f1ede4', '#f1ede4', '#c8ff4d', '#b9a8ff'].map(sprite);

  function size() {
    D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * D; cv.height = H * D;
    const n = W < 700 ? 1100 : 2600;
    if (parts.length !== n) parts = Array.from({ length: n }, () => ({
      x: (Math.random() * 2 - 1) * XR, z: Math.random() * ZR,
      s: .5 + Math.random() * 1.2, r: Math.random() * 6.28, vr: (Math.random() - .5) * .8,
      ph: Math.random() * 6.28, a: .45 + Math.random() * .55, k: Math.random() * sprites.length | 0,
    }));
  }

  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now; t += dt;
    sc += (scrollY / H - sc) * .08; mx += ((px > -1e3 ? px / W - .5 : 0) - mx) * .05;
    const s = Math.min(sc, 4);
    const camY = 1.5 + s * .9, hor = H * (.34 - Math.min(s, 1.2) * .22) + my, f = H * .95, drift = t * .55;
    cv.style.opacity = Math.max(.2, 1 - s * .75);
    g.setTransform(D, 0, 0, D, 0, 0); g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const z = (((p.z - drift) % ZR) + ZR) % ZR + .45;
      const y = Math.sin(p.x * .55 + t * .6) * .28 + Math.sin(z * .5 + t * .45 + p.ph * .2) * .32;
      let X = W / 2 + (p.x - mx * 2.2) * f / z, Y = hor + (camY - y) * f / z;
      if (X < -40 || X > W + 40 || Y > H + 40) continue;
      const dx = X - px, dy = Y - py, d2 = dx * dx + dy * dy;      // частицы разбегаются от курсора
      if (d2 < 16900) { const d = Math.sqrt(d2) || 1, k = (130 - d) / 130 * 34; X += dx / d * k; Y += dy / d * k; }
      const sz = Math.min(46, p.s * f / z * .055);
      const al = p.a * Math.min(1, (ZR - z) / 7) * Math.min(1, (z - .45) * 1.4) * (.75 + .25 * Math.sin(t * 2 + p.ph));
      if (al <= .01 || sz < .6) continue;
      const a = p.r + t * p.vr, c = Math.cos(a) * D, n = Math.sin(a) * D;
      g.setTransform(c, n, -n, c, X * D, Y * D);
      g.globalAlpha = al; g.drawImage(sprites[p.k], -sz / 2, -sz / 2, sz, sz);
    }
    g.globalAlpha = 1;
    if (!still) requestAnimationFrame(frame);
  }

  addEventListener('resize', () => { size(); if (still) frame(0); });
  addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; }, { passive: true });
  addEventListener('pointerleave', () => { px = py = -1e4; });
  addEventListener('scroll', () => {
    $('#top').classList.toggle('solid', scrollY > 40);
    if (still) { sc = scrollY / innerHeight; frame(0); }
  }, { passive: true });
  size(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
